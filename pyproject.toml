[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgar-clause-classification"
version = "0.1.0"
description = "Coursework support code for LexGLUE LEDGAR clause classification experiments."
requires-python = ">=3.10"
readme = "AGENTS.md"

[tool.setuptools]
package-dir = {"" = "src", "modules" = "modules"}
py-modules = [
  "evaluate",
  "preprocess_ledgar",
  "train_classical",
  "train_transformer",
]
packages = [
  "ledgar_pipeline",
  "ledghar_pipeline",
  "modules",
]
